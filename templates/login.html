<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Habinéo — Connexion</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="page-auth">
  {% include 'header.html' %}

  <main class="page-content container">
    <section class="connexion-section">
      <h1>Connexion</h1>
      <p>Connectez-vous à votre espace personnel Habinéo.</p>

      <!-- IMPORTANT: method="post", action vers la route login,
           et name="email"/"password" pour que Flask les lise -->
      <form class="login-form"
            method="post"
            action="{{ url_for('login', next=request.args.get('next')) }}">
        <input type="email" name="email" placeholder="Adresse e-mail" required>
        <input type="password" name="password" placeholder="Mot de passe" required>
        <button type="submit" class="btn btn-accent">Se connecter</button>
      </form>

      <p class="register-link">
        Pas encore de compte ? <a href="{{ url_for('signup') }}">Créez-en un ici</a>.
      </p>
    </section>
  </main>

  {% include 'footer.html' %}
</body>
</html>
