<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Habinéo — Favoris</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="page-account">
  {% include 'header.html' %}
  <main class="page-content">
    <div class="container account-layout">
      {% include 'account_sidebar.html' %}
      <section class="account-main">
        <h1>Mes favoris</h1>
        <div class="cards-grid">
          {% for f in favorites %}
          <article class="card">
            <div class="media"></div>
            <div class="card-body">
              <h3>{{ f.title }}</h3>
              <div class="price">{{ f.price }}</div>
              <a href="#" class="btn btn-ghost">Voir</a>
              <a href="#" class="btn btn-accent">Contacter</a>
            </div>
          </article>
          {% endfor %}
        </div>
      </section>
    </div>
  </main>
  {% include 'footer.html' %}
</body>
</html>
