<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Habinéo — Estimation</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

  {% include 'header.html' %}

  <main class="page-content">
    <section class="container">
      <h1>Estimez votre bien</h1>
      <p>Obtenez une estimation gratuite et rapide de la valeur de votre bien immobilier.</p>

      <form class="estimation-form">
        <input type="text" placeholder="Adresse du bien" required>
        <input type="number" placeholder="Surface (m²)" required>
        <input type="text" placeholder="Ville" required>
        <button type="submit">Obtenir mon estimation</button>
      </form>
    </section>
  </main>

  {% include 'footer.html' %}

</body>
</html>
